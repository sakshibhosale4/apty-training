<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food App - Contact-Us</title>
</head>
<body>
    <header>
        <h1>Welcome to Foodie's Delight</h1>
        <nav>
            <a href="./home-page.html">Home</a> |
            <a href="./about-us.html">About Us</a> |
            <a href="./contact-page.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Get in Touch</h2>
            <p>Email us at <a href="mailto:support@foodiesdelight.com">support@foodiesdelight.com</a></p>
            <p>Phone: +91-9876543210</p>
        </section>

        <section>
            <h2>Send Us a Message</h2>
            <form>
                <label for="name">Name :</label><br>
                <input type="text" id="name" name="name" required><br>

                <label for="email">Email :</label><br>
                <input type="email" id="email" name="email" required><br>

                <label for="message">Message :</label><br>
                <textarea id="message" name="message" required></textarea><br><br>

                <input type="submit" value="Send">
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 Foodie's Delight. All rights reserved.</p>
    </footer>
</body>
</html>
