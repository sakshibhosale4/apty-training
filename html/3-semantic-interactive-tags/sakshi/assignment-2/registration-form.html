<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <main>
        <form action="#">
            <label for="fullname">Full Name :</label>
            <input type="text" id="fullname" name="fullname" required minlength="3" placeholder="Enter your full name">
            <br>
            <label for="email">Email : </label>
            <input type="email" id="email" name="email" required placeholder="Enter your email" pattern="^[a-z0-9._]+@[a-z0-9]+\.[a-z]{2,}$" title="Enter a email like user@example.com">
            <br>
            <label for="password">Password : </label>
            <input type="password" id="password" name="password" required minlength="6" placeholder="Enter password" >
            <br>
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required>
            <br>
            <label for="age">Age :</label>
            <input type="number" id="age" name="age" min="18" max="100" required />
            <br>
            <label>Gender:</label><br>
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label><br>

                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label><br>

                <input type="radio" id="other" name="gender" value="other">
                <label for="other">Other</label>
            <br>
            <label for="phone">Phone Number :</label>
            <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" placeholder="Enter your phone number." required maxlength="10" minlength="10"/>
            <br>
            <label for="country">Country :</label>
            <select id="country" name="country" required>
                <option value="">--Select--</option>
                <option value="india">India</option>
                <option value="california">California</option>
                <option value="other">Other</option>
            </select>
            <br>
            <input type="checkbox" id="terms" name="terms" required />
            <label for="terms">I agree to the Terms and Conditions</label>
            <br><br>
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">

        </form>
    </main>
</body>
</html>
