<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio and Video to web page</title>
</head>
<body>
    <header>
        <h1>Watch and Listen!</h1>
        <p>This page demonstrates how to add audio and video to a webpage.</p>
    </header>
    <main>
        <section>
            <h3>Video</h3>
            <video controls muted loop autoplay width="300" height="250">git 
                <source src="https://download.blender.org/peach/bigbuckbunny_movies/BigBuckBunny_640x360.m4v" type="video/mp4">
                This browser doesnot support the above video format
            </video>
            <p><em>Description : </em>A video named BigBuckBunny</p><br>
        </section>
        <section>
            <h3>Audio</h3>
            <audio controls autoplay muted loop>
                <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mp3">
                Your browser does not support the audio element.
            </audio>
            <p><em>Description : </em>This is an audio containing only music</p>
        </section>
    </main>
</body>
</html>
