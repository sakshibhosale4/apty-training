<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio and Video to web page</title>
</head>
<body>
    <header>
        <h1>Watch and Listen!</h1>
        <p>This page demonstrates how to add audio and video to a webpage.</p>
    </header>
    <main>
        <section>
            <h3>Video</h3>
            <video controls muted loop autoplay width="300" height="250">
                <source src="./assets/Gaur Gopal Das SLEEPLESS Nights for Overnight SUCCESS   [ ENGLISH SPEECH ] - Inspiring English Speech (240p, h264).mp4" type="video/mp4">
                <p><em>Description : </em></p><br>
                This browser doesnot support the above video format
            </video>
        </section>
        <section>
            <h3>Audio</h3>
            <audio muted controls autoplay loop>
                <source src="./assets/Dr Tanu Jain on UPSC Preparation, Corruption, Motivation, Philosophy & Focus  FO305 Raj Shamani - Raj Shamani.mp3" type="audio/mp3">
            <p><em>Description : </em>Swami Gaur Gopal Das's inspiring English Speech. This speech may help you to live a successful life. Watch the whole speech.</p>
            This browser doesnot support the above audio format
            </audio>
        </section>
    </main>
</body>
</html>
