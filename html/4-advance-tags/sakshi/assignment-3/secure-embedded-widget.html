<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Embedded Widget Using iframe SANDBOX ALLOW</title>
</head>
<body>
    <header>
        <h1>Secure Embedded Widget using &lt;iframe&gt; with sandbox and allow attributes to restrict permissions and control features like fullscreen or autoplay</h1>
    </header>
    <main>
        <section>
            <p><em>Description : </em>Dropout To Billionaire - Zerodha's Founder Nikhil Kamath's Journey To SUCCESS - FO5| Raj Shamani </p>
            <iframe 
                width="500"
                height="350"
                src="https://www.youtube.com/embed/cpg78ouK54I" 
                title="Secure Video"
                loading="lazy"
                sandbox="allow-scripts allow-same-origin"
                allow="fullscreen;autoplay">
                Your browser does not support iframes.
            </iframe>
        </section>
    </main>
</body>
</html>
