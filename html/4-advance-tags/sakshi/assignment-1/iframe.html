<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embedded YouTube Video and Map</title>
</head>
<body>
    <header>
        <h1>IFrames</h1>
        <h3>Embedding a YouTube Video and a Map using the IFRAME tag</h3>
    </header>
    <main>
        <section>
            <p><em>Description : </em>Dropout To Billionaire - Zerodha's Founder Nikhil Kamath's Journey To SUCCESS - FO5| Raj Shamani </p>
            <iframe 
                src="https://www.youtube.com/embed/cpg78ouK54I" 
                frameborder="1" 
                width="400" 
                title="Shark Tank India S4"
                allowfullscreen
                loading="lazy"
                height="250" >
                Your browser does not support iframes.
            </iframe>
        </section>
        <hr>
        <section>
            <p><em>Description:</em> Location of Tirupati Tirumala Devasthanam.</p>
            <iframe 
                width="400" 
                height="250" 
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3806.361770546721!2d78.410908714836!3d17.416186587997323!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bcb97006bb0c69b%3A0xb768bff2c703db03!2sTirupati%20Tirumala%20Devasthanam%20Entrance!5e0!3m2!1sen!2sin!4v1691836903836!5m2!1sen!2sin"
                title="Tirupati Tirumala Map"
                frameborder="1" 
                allowfullscreen
                loading="eager">
                Your browser does not support iframes.
            </iframe>
        </section>
    </main>
</body>
</html>
