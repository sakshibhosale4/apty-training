<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unary Assignment Operators - Calculator</title>
    <link rel="stylesheet" href="./styles/unary-assignment-calculator.css">
</head>
<body>
    <header>
        <h1>Assignment Operators</h1>
    </header>
    <main>
        <section>
            <div class="calculator">
                <h2>CALCULATOR</h2>
                <div class="input">
                    <label for="input1">Value 1 : </label>
                    <input type="number" id="input1" name="input1"><br>
                    <label for="input2">Value 2 : </label>
                    <input type="number" id="input2" name="input2">
                </div>
                <div class="operators">
                    <button type="button" id="add">+=</button>
                    <button type="button" id="subtract">-=</button>
                    <button type="button" id="multiply">*=</button>
                    <button type="button" id="divide">/=</button>
                    <button type="button" id="modulo">%=</button>
                    <button type="button" id="unary-add">++</button>
                    <button type="button" id="unary-subtract">--</button>
                    <button type="button" id="clear">Clear</button>
                </div>
                <div class="display"></div>
            </div>
        </section>
    </main>
    <script src="./scripts/unary-assignment-calculator.js"></script>
</body>
</html>
