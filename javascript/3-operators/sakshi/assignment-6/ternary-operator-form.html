<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ternary Operator - Form</title>
    <link rel="stylesheet" href="./styles/ternary-operator-form.css">
</head>
<body>
    <header>
        <h1>Ternary Operator - Form</h1>
    </header>
    <main>
        <section class="form">
            <form action="#">
                <label for="first-name">First Name : </label>
                <input type="text" id="first-name" name="first-name" required placeholder="Enter first name">
                <label for="last-name">Last Name : </label>
                <input type="text" id="last-name" name="last-name" required placeholder="Enter last name">
                <label for="age">Age : </label>
                <input type="number" id="age" name="age" required>
                <button type="submit">Submit</button>
            </form>
            <div id="result"></div>
        </section>
    </main>
    <script src="./scripts/ternary-operator-form.js"></script>
</body>
</html>
