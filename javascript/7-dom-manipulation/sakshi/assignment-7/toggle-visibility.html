<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toggle Visibility of Divs</title>
</head>
<body>
  <header>
    <h1>Toggle Visibility of Divs</h1>
  </header>

  <main>
    <div id="div1">This is Div 1</div>
    <div id="div2" style="display: none;">This is Div 2</div>
    <div id="div3" style="display: none;">This is Div 3</div>

    <button id="toggleBtn">Toggle Divs</button>
  </main>

  <script src="./scripts/toggle-visibility.js" defer></script>
</body>
</html>
