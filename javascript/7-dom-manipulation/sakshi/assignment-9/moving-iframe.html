<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Move iFrame Rows</title>
</head>
<body>
  <header>
    <h1>Move Rows inside iFrame</h1>
  </header>

  <main>
    <iframe id="myFrame" width="100%" height="400"></iframe>
    <div>
      <label for="rowNumber">Select Row (1–10): </label>
      <input type="number" id="rowNumber" min="1" max="10">
    </div>
    <div>
      <button id="up">Up</button>
      <button id="down">Down</button>
      <button id="top">Top</button>
      <button id="bottom">Bottom</button>
    </div>
  </main>

  <script src="./scripts/moving-iframe.js" defer></script>
</body>
</html>
