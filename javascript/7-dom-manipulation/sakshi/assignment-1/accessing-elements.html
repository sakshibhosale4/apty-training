<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessing and Manipulating Elements</title>
</head>
<body>
  <h1>Accessing and Manipulating Elements</h1>

  <p id="para1">Paragraph with ID para1</p>
  <p id="para2">Paragraph with ID para2</p>
  <button id="btnId">Change Color</button>

  <p class="color-toggle">Class paragraph 1</p>
  <p class="color-toggle">Class paragraph 2</p>
  <button id="btnClass">Toggle Background</button>

  <span>Span 1</span>
  <span>Span 2</span>
  <button id="btnTag">Change Text</button>

  <input type="text" name="input1" value="Input 1">
  <input type="text" name="input2" value="Input 2">
  <button id="btnName">Toggle Disabled</button>

  <p data-info="one">Paragraph with data-info="one"</p>
  <p data-info="two">Paragraph with data-info="two"</p>
  <button id="btnAttr">Add Attribute</button>
  <p id="attrResult"></p>

  <script src="./scripts/accessing-elements.js"></script>
</body>
</html>
