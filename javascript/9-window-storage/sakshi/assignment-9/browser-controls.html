<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser Control Example</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 2rem;
    }
    button {
      margin: 0.25rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Browser Window Control</h1>
  </header>
  <main>
    <section>
      <button id="openBtn">Open Window</button>
      <button id="closeBtn">Close Window</button>
      <button id="resizeBtn">Resize Window</button>
    </section>
  </main>
  <script src="./scripts/browser-controls.js"></script>
</body>
</html>
