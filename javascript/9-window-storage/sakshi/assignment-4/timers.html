<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timers</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 2rem;
    }
    section {
      margin-bottom: 2rem;
    }
    button {
      margin: 0.25rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Timers</h1>
  </header>
  <main>
    <section>
      <h2>Countdown Timer</h2>
      <input type="number" id="countdownInput" placeholder="Seconds">
      <button id="startCountdown">Start</button>
      <div id="countdownDisplay">0</div>
    </section>
    <section>
      <h2>Stopwatch</h2>
      <button id="startStopwatch">Start</button>
      <button id="stopStopwatch">Stop</button>
      <button id="resetStopwatch">Reset</button>
      <div id="stopwatchDisplay">0</div>
    </section>
  </main>
  <script src="./scripts/timers.js"></script>
</body>
</html>
