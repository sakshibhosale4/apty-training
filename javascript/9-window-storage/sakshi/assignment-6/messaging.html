<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messaging Example</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 2rem;
    }
    iframe {
      width: 100%;
      height: 200px;
      border: 1px solid #ccc;
      margin-bottom: 1rem;
    }
    input, button {
      margin: 0.25rem;
    }
    #messages {
      margin-top: 1rem;
      background: #f2f2f2;
      padding: 1rem;
      border-radius: 5px;
      min-height: 50px;
    }
    #messages div {
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Messaging Between Iframes</h1>
  </header>
  <main>
    <section>
      <input type="text" id="msgInput" placeholder="Type a message">
      <button id="sendBtn">Send to Iframe</button>
    </section>
    <section>
      <iframe id="childFrame" src="iframe.html"></iframe>
    </section>
    <section>
      <h3>Messages Received:</h3>
      <div id="messages"></div>
    </section>
  </main>
  <script src="./scripts/messaging.js"></script>
</body>
</html>
