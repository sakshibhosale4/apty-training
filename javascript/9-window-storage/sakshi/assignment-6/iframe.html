<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Iframe</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 1rem;
    }
    #received {
      margin-top: 1rem;
      background: #f9f9f9;
      padding: 0.5rem;
      border: 1px solid #ccc;
      min-height: 30px;
    }
    #received div {
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <h3>Iframe Window</h3>
  <div id="received"></div>
  <script>
    const receivedDiv = document.getElementById("received")

    window.addEventListener("message", (event) => {
      const msg = event.data
      if (msg && !msg.startsWith("Ack:")) {
        const div = document.createElement("div")
        div.textContent = "Received from parent: " + msg
        receivedDiv.appendChild(div)

        event.source.postMessage("Ack: " + msg, event.origin)
      }
    })
  </script>
</body>
</html>
