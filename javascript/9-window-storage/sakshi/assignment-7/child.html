<!DOCTYPE html>
<html lang="en">
<head>

  <title>Child Window</title>

    body {
      font-family: Arial, sans-serif;
      padding: 1rem;
    }
    #received {
      margin-top: 1rem;
      background: #f9f9f9;
      padding: 0.5rem;
      border: 1px solid #ccc;
      min-height: 50px;
    }

    }

<body>

  <input type="text" id="msgInput" placeholder="Message to parent">

  <script src="./scripts/window-relationships.js"></script>
</body>
</html>
