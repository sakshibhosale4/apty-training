<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grading System</title>
    <link rel="stylesheet" href="./styles/grading-system.css">
</head>
<body>
    <header>
        <h1>Grading System</h1>
    </header>
    <main>
        <section class="grade-input">
            <div class="input">
                <label for="marks">Enter your marks : </label>
                <input type="number" id="marks" name="marks" min="0" max="100">
            </div>
            <button type="button">Submit marks</button>
            <div id="results"></div>
        </section>
    </main>
    <script src="./scripts/grading-system.js"></script>
</body>
</html>
