<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="./styles/simple-calculator.css">
</head>
<body>
    <header>
        <h1>Simple Calculator</h1>
    </header>
    <main>
    <section>
      <div class="calculator">
        <h2>CALCULATOR</h2>
        <div class="input">
          <label for="input1">Value 1 : </label>
          <input type="number" id="input1" name="input1"><br>
          
          <label for="input2">Value 2 : </label>
          <input type="number" id="input2" name="input2"><br>
          
          <label for="operator">Operator (+, -, *, /, %, ++, --) : </label>
          <input type="text" id="operator" name="operator" maxlength="2">
        </div>
        
        <button type="button" id="calculate-btn">Calculate</button>
        <button type="button" id="clear-btn">Clear</button>
        
        <div class="display" id="display"></div>
      </div>
    </section>
  </main>
  <script src="./scripts/simple-calculator.js"></script>
</body>
</html>
