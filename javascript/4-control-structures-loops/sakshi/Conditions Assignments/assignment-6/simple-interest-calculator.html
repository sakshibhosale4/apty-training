<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Interest Calculator</title>
</head>
<body>
  <header>
    <h1>Simple Interest Calculator</h1>
  </header>
  <main>
    <section>
      <div class="user-inputs">
        <label for="principal">Principal Amount:</label>
        <input type="number" id="principal" name="principal" required min="0"><br><br>

        <label for="rate">Rate of Interest (%):</label>
        <input type="number" id="rate" name="rate" required min="0"><br><br>

        <label for="time">Time (in years):</label>
        <input type="number" id="time" name="time" required min="0"><br><br>
      </div>
      <button type="button" id="calculate-btn">Calculate</button><br><br>
      <button type="button" id="clear-btn">Clear</button><br><br>
      <div id="result"></div>
    </section>
  </main>
  <script src="./scripts/simple-interest-calculator.js"></script>
</body>
</html>
