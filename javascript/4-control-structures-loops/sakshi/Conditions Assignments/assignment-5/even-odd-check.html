<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odd - Even Checker</title>
</head>
<body>
    <header>
        <h1>Odd - Even Checker</h1>
    </header>
    <main>
        <section>
            <div class="user-inputs">
                <label for="numberInput">Enter a number : </label>
                <input type="number" id="numberInput" name="numberInput" required><br><br>
            </div>
            <button type="button" id="check-btn">Check</button><br><br>
            <button type="button" id="clear-btn">Clear</button><br><br>
            <div id="result"></div>
        </section>
    </main>
    <script src="./scripts/even-odd-check.js"></script>
</body>
</html>
