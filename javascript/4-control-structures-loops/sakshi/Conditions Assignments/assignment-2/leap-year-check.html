<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leap Year Checker</title>
</head>
<body>
    <header>
        <h1>Leap Year Checker</h1>
    </header>
    <main>
        <section class="year-input">
            <div class="input">
                <label for="year">Enter the year : </label>
                <input type="number" id="year" name="year" min="0">
            </div>
            <br>
            <button type="button">Submit</button>
            <br><br>
            <div id="results"></div>
        </section>
    </main>
    <script src="./scripts/leap-year-check.js"></script>
</body>
</html>
