<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pyramid Pattern</title>
</head>
<body>
  <header>
    <h1>Pyramid Pattern Generator</h1>
  </header>
  <main>
    <section>
      <div class="input">
        <label for="rows">Enter number of rows:</label>
        <input type="number" id="rows" name="rows" required><br><br>
      </div>
      <button id="generate" type="button">Generate Pyramid</button><br><br>
      <pre id="result"></pre>
      <button id="clear" type="button">Clear</button>
    </section>
  </main>
  <script src="./scripts/pyramid-pattern.js"></script>
</body>
</html>
