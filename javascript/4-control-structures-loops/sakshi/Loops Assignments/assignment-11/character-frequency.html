<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Character Frequency Counter</title>
</head>
<body>
  <header>
    <h1>Character Frequency Counter</h1>
  </header>
  <main>
    <section>
      <div class="input">
        <label for="text">Enter a string:</label>
        <input type="text" id="text" name="text" placeholder="e.g. hello world"><br><br>
      </div>
      <button id="analyze" type="button">Analyze</button><br><br>
      <div id="result"></div>
      <button id="clear" type="button">Clear</button>
    </section>
  </main>
  <script src="./scripts/character-frequency.js"></script>
</body>
</html>
