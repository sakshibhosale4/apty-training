<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sum and Average of Array Elements</title>
</head>
<body>
    <header>
        <h1>Sum and Average of Array Elements</h1>
    </header>
    <main>
        <section>
            <div class="input">
                <label for="numbers">Enter numbers (comma-separated):</label>
                <input type="text" id="numbers" name="numbers" placeholder="e.g. 10, 20, 30, 40"><br><br>
            </div>
            <button id="calculate" type="button">Calculate</button>
            <div id="result"></div><br>
            <button id="clear" type="button">Clear</button><br><br>
        </section>
    </main>
    <script src="./scripts/array-sum-avg.js"></script>

</html>
