<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prime Numbers Finder</title>
</head>
<body>
  <header>
    <h1>Prime Numbers Finder</h1>
  </header>
  <main>
    <section>
      <div class="input">
        <label for="start">Start:</label>
        <input type="number" id="start" name="start" required><br><br>
        <label for="end">End:</label>
        <input type="number" id="end" name="end" required><br><br>
      </div>
      <button id="find" type="button">Find Primes</button><br><br>
      <div id="result"></div>
      <button id="clear" type="button">Clear</button>
    </section>
  </main>
  <script src="./scripts/prime-numbers.js"></script>
</body>
</html>
