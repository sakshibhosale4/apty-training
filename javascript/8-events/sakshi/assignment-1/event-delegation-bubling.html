<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Table Highlight Example</title>
</head>
<body>
  <header>
    <h1>Highlight Row and Column</h1>
  </header>
  <main>
    <section>
      <table id="highlightTable" border="1">
        <tbody>
          <tr>
            <td>1-1</td><td>1-2</td><td>1-3</td>
          </tr>
          <tr>
            <td>2-1</td><td>2-2</td><td>2-3</td>
          </tr>
          <tr>
            <td>3-1</td><td>3-2</td><td>3-3</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>
  <script src="./scripts/event-delegation-bubling.js"></script>
</body>
</html>
