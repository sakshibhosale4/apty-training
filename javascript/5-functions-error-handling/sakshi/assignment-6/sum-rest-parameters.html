<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rest Parameters - Sum of Numbers</title>
</head>
<body>
    <header>
        <h1>Sum of Numbers Using Rest Parameters</h1>
    </header>
    <main>
        <section>
            <form id="sumForm">
                <label for="numbers">Enter numbers (comma separated):</label>
                <input type="text" id="numbers" name="numbers" required><br><br>
                <button type="submit">Calculate Sum</button>
                <button type="button" id="clearBtn">Clear</button>
            </form>
            <p id="result"></p>
        </section>
    </main>
    <script src="./scripts/sum-rest-parameters.js"></script>
</body>
</html>
