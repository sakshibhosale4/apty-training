<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON Parser with Error Handling</title>
</head>
<body>
  <header>
    <h1>JSON Parser with Error Handling</h1>
  </header>

  <main>
    <section>
      <h2>Enter JSON String</h2>
      <form id="jsonForm">
        <label for="jsonInput">JSON:</label>
        <textarea id="jsonInput" rows="4" cols="40" placeholder='e.g. {"key": "value"}' required></textarea>
        <br><br>

        <button type="button" id="parseBtn">Parse JSON</button>
        <button type="button" id="clearBtn">Clear</button>
      </form>

      <h3>Result</h3>
      <pre id="result"></pre>
      <p id="error" ></p>
    </section>
  </main>
  <script src="./scripts/syntax-error.js"></script>
</body>
</html>
