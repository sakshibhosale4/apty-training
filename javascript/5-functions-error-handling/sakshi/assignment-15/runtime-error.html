<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Runtime Error Handling - User City</title>
</head>
<body>
  <header>
    <h1>Find User's City</h1>
  </header>
  <main>
    <section>
      <h2>Enter Username</h2>
      <form id="userForm">
        <label for="username">Username:</label>
        <input type="text" id="username" placeholder="e.g. lucky" required>
        <br><br>
        <button type="button" id="checkBtn">Find City</button>
        <button type="button" id="clearBtn">Clear</button>
      </form>
      <h3>Result</h3>
      <p id="result"></p>
      <p id="error"></p>
    </section>
  </main>
  <script src="./script/runtime-error.js"></script>
</body>
</html>
