<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Account with Closures</title>
</head>
<body>
    <header>
        <h1>Bank Account Simulator</h1>
    </header>
    <main>
        <section>
            <label for="depositAmount">Deposit Amount:</label>
            <input type="number" id="depositAmount" step="any"><button id="depositBtn">Deposit</button><br><br>

            <label for="withdrawAmount">Withdraw Amount:</label>
            <input type="number" id="withdrawAmount" step="any"><button id="withdrawBtn">Withdraw</button><br><br>

            <button id="checkBtn">Check Balance</button>
            <button id="clearBtn">Clear Output</button>

            <p id="output"></p>
        </section>
    </main>
    <script src="./scripts/bank-account.js"></script>
</body>
</html>
