<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lexical Scoping in Nested Functions</title>
</head>
<body>
    <header>
        <h1>Lexical Scoping Example</h1>
    </header>
    <main>
        <section>
            <label for="var1">Enter First Value:</label>
            <input type="text" id="var1"><br><br>
            <label for="var2">Enter Second Value:</label>
            <input type="text" id="var2"><br><br>
            <label for="var3">Enter Third Value:</label>
            <input type="text" id="var3"><br><br>
            <button type="button" id="showBtn">Show Concatenation</button>
            <button type="button" id="clearBtn">Clear</button>
            <p id="output"></p>
        </section>
    </main>
    <script src="./scripts/nested-functions.js"></script>
</body>
</html>
