<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rectangle Area with Default Parameters</title>
</head>
<body>
    <header>
        <h1>Calculate Rectangle Area</h1>
    </header>
    <main>
        <section>
            <form id="areaForm">
                <label for="length">Length:</label>
                <input type="number" id="length" name="length" step="any" placeholder="Default 5"><br><br>

                <label for="width">Width:</label>
                <input type="number" id="width" name="width" step="any" placeholder="Default 3"><br><br>

                <button type="submit">Calculate</button>
                <button type="button" id="clearBtn">Clear</button>
            </form>
            <p id="result"></p>
        </section>
    </main>
    <script src="./scripts/rectangle-area.js"></script>
</body>
</html>
