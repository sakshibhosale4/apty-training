<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorting an Array - Function Expression</title>
</head>
<body>
    <header>
        <h1>Sorting an Array - Function Expression</h1>
    </header>
    <main>
        <section>
            <label for="array">Enter array elements (comma separated)</label>
            <input type="text" name="array" id="array" required><br><br>
            <button type="button" id="sortBtn">Sort</button>
            <div id="results"></div>
            <button type="button" id="clearBtn">Clear</button>
        </section>
    </main>
    <script src="./scripts/sorting-array.js"></script>
