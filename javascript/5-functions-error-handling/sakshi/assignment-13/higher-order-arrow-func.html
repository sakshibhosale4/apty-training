<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Higher-Order Function with Arrow Functions</title>
</head>
<body>
  <header>
    <h1>Higher-Order Function with Arrow Functions</h1>
  </header>
  <main>
    <section>
      <h2>Filter Numbers</h2>
      <form id="filterForm">
        <fieldset>
          <legend>Enter Inputs</legend>
          <label for="numbers">Numbers (comma-separated):</label>
          <input type="text" id="numbers" name="numbers" placeholder="e.g. 10,20,30,40,50" required>
          <br><br>
          <label for="limit">Limit:</label>
          <input type="number" id="limit" name="limit" placeholder="e.g. 25" required>
          <br><br>
          <button id="filterBtn" type="button">Filter Numbers</button>
          <button id="clearBtn" type="button">Clear</button>
        </fieldset>
      </form>
      <p id="error" role="alert"></p>
      <article>
        <h3>Filtered Result</h3>
        <p id="result"></p>
      </article>
    </section>
  </main>
  <script src="./scripts/higher-order-arrow-func.js"></script>
</body>
</html>
