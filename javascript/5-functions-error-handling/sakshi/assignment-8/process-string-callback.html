<!DOCTYPE html>
<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Callback Function with Default Parameter</title>
</head>
<body>
    <header>
        <h1>Process String using Callback</h1>

    <main>

    </main>
