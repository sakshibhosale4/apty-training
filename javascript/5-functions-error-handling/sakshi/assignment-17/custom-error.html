<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Error Calculator</title>
</head>
<body>
  <header>
    <h1>Calculator with Custom Errors</h1>
  </header>

  <main>
    <section>
      <h2>Enter Values</h2>
      <form id="calcForm">
        <label for="num1">First Number:</label>
        <input type="text" id="num1" placeholder="Enter first number" required>
        <br><br>

        <label for="num2">Second Number:</label>
        <input type="text" id="num2" placeholder="Enter second number" required>
        <br><br>

        <label for="operator">Operator (+ - * /):</label>
        <input type="text" id="operator" maxlength="1" placeholder="+" required>
        <br><br>

        <button type="button" id="calcBtn">Calculate</button>
        <button type="button" id="clearBtn">Clear</button>
      </form>

      <h3>Output</h3>
      <p id="result"></p>
      <p id="error"></p>
    </section>
  </main>
  <script src="./scripts/custom-error.js"></script>
</body>
</html>
