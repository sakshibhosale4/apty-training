<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fibonacci Series - Recursive Function</title>
</head>
<body>
    <header>
        <h1>Fibonacci Series - Recursive Function</h1>
    </header>
    <main>
        <section>
            <form id="fibonacciForm">
                <label for="number">Enter a number:</label>
                <input type="number" id="number" name="number" min="1" required><br><br>
                <button type="submit">Generate</button><br><br>
            </form>
            <div id="result"></div>
            <button type="button" id="clearBtn">Clear</button>
        </section>
    </main>
    <script src="./scripts/recursive-fibonacci.js"></script>
</body>
</html>
