<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Higher-Order Function - repeatAction</title>
</head>
<body>
  <h2>Generate List Items</h2>
  <label for="text">Enter text:</label>
  <input type="text" id="text" placeholder="Enter list item text">
  <br><br>
  <label for="count">How many times?</label>
  <input type="number" id="count" min="1" placeholder="e.g. 5">
  <br><br>
  <button id="generateBtn" type="button">Generate List</button>
  <button id="clearBtn" type="button">Clear</button>
  <p id="error"></p>
  <ul id="list"></ul>
  <script src="./scripts/higher-order-repeat-func.js"></script>
</body>
</html>
