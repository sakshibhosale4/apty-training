<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escape Sequence Converter</title>
</head>
<body>
  <header>
    <h1>Escape Sequence Converter</h1>
  </header>
  <main>
    <section>
      <label for="inputString">Enter a string:</label><br>
      <textarea id="inputString" rows="4" cols="40" placeholder="Type something like Hello\nWorld\t!"></textarea><br>
      <button id="convertBtn">Convert</button>
    </section>
    <section>
      <h2>Converted String:</h2>
      <p id="output"></p>
    </section>
  </main>
  <script src="./scripts/escape-sequences.js"></script>
</body>
</html>
