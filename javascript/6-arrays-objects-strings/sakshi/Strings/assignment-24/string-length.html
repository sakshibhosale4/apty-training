<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Length Calculator</title>
</head>
<body>
  <header>
    <h1>Word Length Calculator</h1>
  </header>

  <main>
    <section>
      <label for="inputString">Enter a sentence:</label>
      <input type="text" id="inputString" placeholder="Type your string here">
      <button id="calcBtn">Calculate</button>
    </section>

    <section>
      <h2>Result:</h2>
      <p id="output"></p>
    </section>
  </main>
  <script src="./scripts/string-length.js"></script>
</body>
</html>
