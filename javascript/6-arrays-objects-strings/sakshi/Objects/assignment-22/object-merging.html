<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deep Object Merging</title>
</head>
<body>
  <header>
    <h1>Deep Merge Two Objects</h1>
  </header>
  <main>
    <section>
      <label for="obj1Input">Enter First Object (JSON):</label><br>
      <textarea id="obj1Input" rows="4" cols="40">{"a": 1, "b": {"x": 10}}</textarea><br>
      <label for="obj2Input">Enter Second Object (JSON):</label><br>
      <textarea id="obj2Input" rows="4" cols="40">{"b": {"y": 20}, "c": 3}</textarea><br>
      <button id="mergeBtn">Merge Objects</button>
    </section>
    <section>
      <h2>Output:</h2>
      <pre id="output"></pre>
    </section>
  </main>
  <script src="./scripts/object-merging.js"></script>
</body>
</html>
