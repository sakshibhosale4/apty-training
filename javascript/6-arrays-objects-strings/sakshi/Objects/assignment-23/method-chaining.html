<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Method Chaining Example</title>
</head>
<body>
  <header>
    <h1>Person Method Chaining</h1>
  </header>
  <main>
    <section>
      <label for="nameInput">Enter Name:</label>
      <input type="text" id="nameInput" placeholder="John" required>
      <label for="ageInput">Enter Age:</label>
      <input type="number" id="ageInput" placeholder="25" required>
      <button id="createBtn">Create & Greet</button>
    </section>
    <section>
      <h2>Output:</h2>
      <pre id="output"></pre>
    </section>
  </main>
  <script src="./scripts/method-chaining.js"></script>
</body>
</html>
