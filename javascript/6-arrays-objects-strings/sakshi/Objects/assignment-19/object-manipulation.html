<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Object Manipulation with Dynamic Keys</title>
</head>
<body>
  <header>
    <h1>Dynamic Object Manipulation</h1>
  </header>
  
  <main>
    <section>
      <label for="keyInput">Enter Key:</label>
      <input type="text" id="keyInput" placeholder="e.g. name">
      
      <label for="valueInput">Enter Value:</label>
      <input type="text" id="valueInput" placeholder="e.g. John Doe">
      
      <button id="addBtn">Add / Update</button>
    </section>

    <section>
      <h2>Current Object</h2>
      <pre id="output">{}</pre>
    </section>
  </main>

  <script src="./scripts/object-manipulation.js"></script>
</body>
</html>
