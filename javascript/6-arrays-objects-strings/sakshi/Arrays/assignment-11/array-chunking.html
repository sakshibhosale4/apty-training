<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Array Chunking</title>
</head>
<body>
  <h1>Array Chunking</h1>
  <label>Enter array:</label>
  <input type="text" id="arrayInput" placeholder="e.g. 1,2,3,4,5">
  <br><br>
  <label>Chunk size:</label>
  <input type="number" id="chunkSize" min="1" placeholder="e.g. 2">
  <br><br>
  <button id="chunkBtn">Chunk Array</button>
  <p id="errorEl"></p>
  <p id="resultEl"></p>
  <script src="./scripts/array-chunking.js"></script>
</body>
</html>
