<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slice Array Example</title>
</head>
<body>
  <header>
    <h1>Slice Array Example</h1>
  </header>
  <main>
    <section>
      <label for="arrayInput">Enter an array of names:</label><br><br>
      <input type="text" id="arrayInput" placeholder='Eg: ["Alice","Bob","Charlie","Daisy","Eve"] or Alice,Bob,Charlie,Daisy,Eve'>
      <button id="sliceBtn">Run Slice</button>
    </section>
    <section>
      <h2>Results:</h2>
      <p id="firstThree"></p>
      <p id="lastTwo"></p>
      <p id="errorEl"></p>
    </section>
  </main>
  <script src="./scripts/array-slicing.js"></script>
</body>
</html>
