<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Array Merge with Rest & Spread</title>
</head>
<body>
  <header>
    <h1>Array Manipulation with Rest & Spread</h1>
  </header>
  <main>
    <section>
      <form id="mergeForm">
        <label for="arr1">Array 1:</label>
        <input id="arr1" name="arr1" value="[1, 2, 3]" aria-label="First array">
        <label for="arr2">Array 2:</label>
        <input id="arr2" name="arr2" value="[3, 4, 5]" aria-label="Second array">
        <button type="submit">Merge Arrays</button>
      </form>
    </section>
    <section>
      <h2>Result</h2>
      <p id="result"></p>
    </section>
  </main>
  <script src="./scripts/rest-spread-operators.js"></script>
</body>
</html>
