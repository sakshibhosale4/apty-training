<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Array Flattening Function</title>
</head>
<body>
  <header>
    <h1>Custom Array Flattening Function</h1>
  </header>
  <main>
    <section>
      <label for="arrayInput">Enter Nested Array :</label><br><br>
      <input type="text" id="arrayInput" placeholder="Eg : [1,2,[3,5],[5,[6,7]]]">
      <button id="flattenBtn">Flatten</button>
    </section>
    <section>
      <h2>Result :</h2>
      <p id="resultEl"></p>
      <p id="errorEl"></p>
      <button type="button" id="clearBtn">Clear</button>
    </section>
  </main>
  <script src="./scripts/array-flattening.js"></script>
</body>
</html>
