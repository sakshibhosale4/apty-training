<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join Array of Strings</title>
</head>
<body>
  <header>
    <h1>Join Array of Strings into Sentence</h1>
  </header>
  <main>
    <section>
      <label for="arrayInput">Enter Array of Words:</label><br><br>
      <input type="text" id="arrayInput" placeholder='Eg: ["hello","world","this","is","js"]'>
      <button id="convertBtn" type="button">Convert</button>
      <button id="clearBtn" type="button">Clear</button>
    </section>
    <section>
      <h2>Result:</h2>
      <p id="resultEl"></p>
      <p id="errorEl"></p>
    </section>
  </main>
  <script src="./scripts/join-arrays.js"></script>
</body>
</html>
