<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Every and Some Example</title>
</head>
<body>
  <header>
    <h1>Student Scores Check</h1>
  </header>
  <main>
    <section>
      <label for="arrayInput">Enter array of students:</label><br>
      <input type="text" id="arrayInput" size="80" placeholder='[{"name":"Bob","score":80},{"name":"Alice","score":90}]'>
      <button id="checkBtn">Check Scores</button>
      <p id="errorEl"></p>
      <div id="resultEl"></div>
    </section>
  </main>
  <script src="./scripts/every-some.js"></script>
</body>
</html>
