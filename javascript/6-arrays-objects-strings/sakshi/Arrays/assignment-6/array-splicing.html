<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Splice Array Example</title>
</head>
<body>
  <header>
    <h1>Splice Array Example</h1>
  </header>
  <main>
    <section>
      <label for="arrayInput">Enter an array of colors:</label><br><br>
      <input type="text" id="arrayInput" placeholder='Eg: ["Red","Blue","Green","Yellow"] or Red,Blue,Green,Yellow'>
      <button id="spliceBtn">Run Splice</button>
    </section>
    <section>
      <h2>Results:</h2>
      <p id="resultEl"></p>
      <p id="errorEl"></p>
    </section>
  </main>
  <script src="./scripts/array-splicing.js"></script>
</body>
</html>
