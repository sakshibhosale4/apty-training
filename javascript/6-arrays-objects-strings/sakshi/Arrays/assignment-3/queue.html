<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Queue Data Structure</title>
</head>
<body>
  <header>
    <h1>Queue Data Structure (Array Implementation)</h1>
  </header>
  <main>
    <section>
      <label for="queueInput">Enter Element to Enqueue:</label><br><br>
      <input type="text" id="queueInput" placeholder="Enter value">
      <button id="enqueueBtn">Enqueue</button>
      <button id="dequeueBtn">Dequeue</button>
      <button id="peekBtn">Peek</button>
      <button id="isEmptyBtn">Is Empty?</button>
      <button id="clearBtn">Clear Queue</button>
    </section>
    <section>
      <h2>Result :</h2>
      <p id="resultEl"></p>
      <p id="errorEl"></p>
    </section>

    <section>
      <h2>Current Queue :</h2>
      <p id="queueDisplay">[ ]</p>
    </section>
  </main>

  <script src="./scripts/queue.js"></script>
</body>
</html>
