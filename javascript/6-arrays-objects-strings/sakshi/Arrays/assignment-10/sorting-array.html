<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Array Sorting</title>
</head>
<body>
  <h2>Custom Array Sorting by Score</h2>

  <label for="arrayInput">Enter Array of Students:</label><br>
  <input type="text" id="arrayInput" placeholder='[{"name":"Bob","score":80},{"name":"Alice","score":90}]' size="80">
  <button id="sortBtn">Sort</button>

  <p id="errorEl"></p>
  <p id="resultEl"></p>

  <script src="./scripts/sorting-array.js"></script>
</body>
</html>
