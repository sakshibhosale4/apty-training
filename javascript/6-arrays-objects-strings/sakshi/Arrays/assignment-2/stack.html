<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Stack Implementation</title>
</head>
<body>
  <header>
    <h1>Stack Data Structure (Dynamic Array)</h1>
  </header>
  <main>
    <section>
      <label for="stackInput">Enter Element to Push:</label><br><br>
      <input type="text" id="stackInput" placeholder="Enter value">
      <button id="pushBtn">Push</button>
      <button id="popBtn">Pop</button>
      <button id="peekBtn">Peek</button>
      <button id="isEmptyBtn">Is Empty?</button>
      <button id="clearBtn">Clear Stack</button>
    </section>
    <section>
      <h2>Result :</h2>
      <p id="resultEl" aria-live="polite" class="result"></p>
      <p id="errorEl" aria-live="polite" class="error"></p>
    </section>
    <section>
      <h2>Current Stack :</h2>
      <p id="stackDisplay">[ ]</p>
    </section>
  </main>
  <script src="./scripts/stack.js"></script>
</body>
</html>
